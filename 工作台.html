function bindPeriodPage(){
  // 日历天点击：选中日期并局部更新，避免整页重绘闪烁
  document.querySelectorAll("[data-date]").forEach(c=>c.addEventListener("click",()=>{
    selDate = c.dataset.date;
    // 更新选中样式
    document.querySelectorAll(".cal-cell.selected").forEach(el => el.classList.remove("selected"));
    c.classList.add("selected");
    // 更新"月经来了"卡片中的日期显示
    const cameSection = document.querySelector(".seg[data-rec='came']");
    if(cameSection){
      const card = cameSection.closest(".card");
      if(card){
        const h2 = card.querySelector("h2");
        if(h2) h2.innerHTML = `月经来了 <span class="sub">${selDate}</span>`;
      }
    }
    const goneSection = document.querySelector(".seg[data-rec='gone']");
    if(goneSection){
      const card = goneSection.closest(".card");
      if(card){
        const h2 = card.querySelector("h2");
        if(h2) h2.innerHTML = `月经走了 <span class="sub">${selDate}</span>`;
      }
    }
  }));
  // 月经来了：是/否（两个按钮始终可用）
  document.querySelectorAll(".seg[data-rec='came'] button").forEach(b=>b.addEventListener("click",()=>{
    if(!selDate){ toast("请先在日历中点选日期"); return; }
    const v = b.dataset.v;
    if(v === "yes"){
      if(state.periods.some(p => p.start === selDate)){ toast("该日期已标记为经期开始"); return; }
      state.periods.push({start: selDate, end: selDate, note:""});
      state.periods.sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0);
      save(); toast("已记录经期开始 "+selDate); refPeriod();
    } else {
      const idx = state.periods.findIndex(p => p.start === selDate);
      if(idx === -1){ toast("该日期没有经期开始记录"); return; }
      state.periods.splice(idx, 1);
      save(); toast("已取消经期开始"); refPeriod();
    }
  }));
  // 月经走了：是/否（两个按钮始终可用）
  document.querySelectorAll(".seg[data-rec='gone'] button").forEach(b=>b.addEventListener("click",()=>{
    if(!selDate){ toast("请先在日历中点选日期"); return; }
    const v = b.dataset.v;
    if(v === "yes"){
      if(state.periods.some(p => p.end === selDate)){ toast("该日期已标记为经期结束"); return; }
      const last = [...state.periods].sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0).reverse().find(p => p.start <= selDate);
      if(!last){ toast("没有找到可结束的经期，请先标记开始日期"); return; }
      last.end = selDate;
      save(); toast("已记录经期结束 "+selDate); refPeriod();
    } else {
      const p = state.periods.find(p => p.end === selDate);
      if(!p){ toast("该日期没有经期结束记录"); return; }
      if(p.end === p.start){
        // 经期只有1天，取消结束标记即删除整条记录
        state.periods = state.periods.filter(pp => pp !== p);
      } else {
        p.end = p.start;
      }
      save(); toast("已取消经期结束"); refPeriod();
    }
  }));
  // 历史展开至新页面
  const ho=document.getElementById("histOpen");
  if(ho) ho.addEventListener("click",()=>{ historyMode=true; selDate=null; refPeriod(); });
  // 年视图切换
  const ty=document.getElementById("toYear");
  if(ty) ty.addEventListener("click",()=>{ calMode="year"; selDate=null; refPeriod(); });
  // 月历翻页
  document.querySelectorAll("[data-cal]").forEach(b=>b.addEventListener("click",()=>{
    const dir = b.dataset.cal==="prev" ? -1 : 1;
    let {y,m} = calView;
    m += dir;
    if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
    calView={y,m}; refPeriod();
  }));
  const ySel=document.getElementById("calYear");
  const mSel=document.getElementById("calMonth");
  if(ySel) ySel.addEventListener("change",()=>{ calView={y:num(ySel.value), m:calView.m}; refPeriod(); });
  if(mSel) mSel.addEventListener("change",()=>{ calView={y:calView.y, m:num(mSel.value)}; refPeriod(); });
}

  const f=document.getElementById("salaryForm");
  if(!f) return;

    e.preventDefault();
    const date = f["s-date"].value.trim();
    if(!date){ toast("请填写日期"); return; }
    const r = {date};
    SALARY_HEADERS.forEach(h=>{ r[h] = num(f["s-"+h].value); });

    save(); toast("已保存 "+date); navigate("salary-basic");
  });
}

/* ============== 囤货辅助函数 ============== */
function flattenSpaceTree(nodes, parentPath=''){
  let r = [];
  for(const n of nodes){
    const p = parentPath ? parentPath + ' > ' + n.name : n.name;
    if(n.id !== 'root') r.push({id:n.id, path:p, name:n.name});
    if(n.children && n.children.length) r = r.concat(flattenSpaceTree(n.children, p));
  }
  return r;
}
function getSpacePath(id){
  if(!id) return '';
  const all = flattenSpaceTree([state.settings.spaces]);
  const f = all.find(s => s.id === id);
  return f ? f.path : '';
}
function getAllSpaceIds(node){
  let ids = [node.id];
  if(node.children && node.children.length){
    node.children.forEach(c => { ids = ids.concat(getAllSpaceIds(c)); });
  }
  return ids;
}
function spaceOptsHtml(selId=''){
  return flattenSpaceTree([state.settings.spaces]).map(s => `<option value="${s.id}" ${s.id===selId?'selected':''}>${s.path}</option>`).join('');
}
function renderSpaceTreeEdit(nodes, depth=0){
  const pad = depth * 16;
  return nodes.map(n => `<div class="space-node" style="margin-left:${pad}px;display:flex;align-items:center;gap:8px;padding:4px 0">
    <span>${esc(n.name)}</span>
    <button class="del" data-add-child="${n.id}">+</button>
    ${n.id !== 'root' ? `<button class="del" data-del-space="${n.id}">×</button>` : ''}
    ${n.children && n.children.length ? renderSpaceTreeEdit(n.children, depth+1) : ''}
  </div>`).join('');
}

function pageStockOverview(){
  const items = state.stock;
  const total = items.length;
  const unopened = items.filter(i=>i.status==="未开封").length;
  const inUse = items.filter(i=>i.status==="使用中").length;
  const usedUp = items.filter(i=>i.status==="已用完").length;
  // 近30天过期（排除已忽略的，食品同时检查最佳食用日期）
  const soon = items.filter(i=>{
    if(i.dismissedExpiry) return false;
    const expiry = i.expiryDate || i.bestBeforeDate;
    if(!expiry) return false;
    const diff = daysBetween(todayStr(), expiry);
    return diff >= 0 && diff <= 30;
  });
  // 按分类统计
  const catCount = {};
  items.forEach(i=>{ catCount[i.category] = (catCount[i.category]||0) + i.quantity; });
  const catHtml = Object.entries(catCount).map(([c,n])=>`<div class="stat"><div class="label">${c}</div><div class="value num">${n}</div></div>`).join("");

  // 库存不足（数量 <= 最低库存）
  const lowStock = items.filter(i => (i.minStock || 1) > 0 && i.quantity <= (i.minStock || 1) && i.status !== '已用完');

  // 所有标签
  const allTags = [...new Set(items.flatMap(i => i.tags || []))].sort();

  // 最近消耗记录
  const allCons = [];
  items.forEach((item, idx)=>{
    if(item.consumption && item.consumption.length){
      item.consumption.forEach(c => { allCons.push({...c, itemName: item.name, itemIdx: idx}); });
    }
  });
  allCons.sort((a,b)=>a.date<b.date?1:-1);
  const recentCons = allCons.slice(0, 5);

  return `<div class="row-stats" style="margin-bottom:14px">
      <div class="stat"><div class="label">总物品</div><div class="value num">${total}<small>种</small></div></div>
      <div class="stat sage"><div class="label">未开封</div><div class="value num">${unopened}</div></div>

      <div class="scroll"><table><thead><tr><th>名称</th><th>剩余</th><th>最低库存</th><th>空间</th></tr></thead><tbody>

        }).join("")}
      </tbody></table></div></div>` : ''}
    ${soon.length ? `<div class="card" style="border-left:3px solid var(--rose)"><h2>即将过期 <span class="sub">${soon.length} 件</span></h2>
      <div class="scroll"><table><thead><tr><th>名称</th><th>到期</th><th>空间</th><th></th></tr></thead><tbody>
        ${soon.map(i=>{
          const ri = state.stock.indexOf(i);
          return `<tr><td>${esc(i.name)}</td><td class="num">${i.expiryDate}</td><td class="muted">${esc(getSpacePath(i.storageLocation))}</td><td><button class="del" data-dismiss-expiry="${ri}">×</button></td></tr>`;
        }).join("")}
      </tbody></table></div></div>` : ''}
    <div class="card">
      <h2>消耗记录 <span class="sub">最近</span></h2>
      ${recentCons.length ? `<div class="scroll"><table><thead><tr><th>日期</th><th>物品</th><th>数量</th><th>备注</th></tr></thead><tbody>
        ${recentCons.map(c => `<tr><td class="num">${c.date}</td><td>${esc(c.itemName)}</td><td class="num">-${c.quantity}</td><td class="muted">${esc(c.note||'')}</td></tr>`).join("")}

    if(!groups[sp]) groups[sp] = [];
    groups[sp].push(r);

  // 空间排序：按路径
  const spaceOrder = Object.keys(groups).sort((a,b) => {
    const pa = getSpacePath(a) || a;

/* ============== 囤货事件绑定 ============== */
function bindStockOverview(){
  const goAdd = document.getElementById("goStockAdd");
  if(goAdd) goAdd.addEventListener("click",()=>{ navigate("stock-add"); });
  const goConsume = document.getElementById("goConsumeBtn");
  if(goConsume) goConsume.addEventListener("click", ()=>{
    // 弹出消耗录入对话框
    const items = state.stock.filter(i => i.status !== '已用完');
    if(!items.length){ toast("没有可消耗的物品"); return; }
    const itemOpts = items.map((i,idx) => `<option value="${state.stock.indexOf(i)}">${esc(i.name)} (剩余 ${i.quantity} ${i.unit})</option>`).join('');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = `<div class="card" style="max-width:380px;width:90%;margin:0">
      <h3>录入消耗</h3>
      <div class="field"><label>物品</label><select id="consumeItem">${itemOpts}</select></div>
      <div class="row">
        <div class="field"><label>数量</label><input type="number" id="consumeQty" value="1" min="1" step="1"></div>
        <div class="field"><label>日期</label><input type="date" id="consumeDate" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>备注</label><input type="text" id="consumeNote" placeholder="可选"></div>
      <div style="text-align:center;margin-top:10px;display:flex;gap:8px;justify-content:center">
        <button class="btn primary" id="consumeSave">保存</button>
        <button class="btn ghost" id="consumeCancel">取消</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    initAllPickers(overlay);
    overlay.querySelector('#consumeCancel').addEventListener('click', ()=>overlay.remove());
    overlay.querySelector('#consumeSave').addEventListener('click', ()=>{
      const idx = num(overlay.querySelector('#consumeItem').value);
      const qty = num(overlay.querySelector('#consumeQty').value);
      const date = overlay.querySelector('#consumeDate').value;
      const note = overlay.querySelector('#consumeNote').value.trim();
      if(!qty || qty < 1){ toast('请输入有效数量'); return; }
      const item = state.stock[idx];
      if(!item){ toast('物品不存在'); overlay.remove(); return; }
      if(!item.consumption) item.consumption = [];
      const alreadyConsumed = item.consumption.reduce((s,c)=>s+c.quantity, 0);
      const remaining = item.quantity - alreadyConsumed;
      if(qty > remaining){ toast('消耗量超过剩余量（剩余 '+remaining+' '+item.unit+'）'); return; }
      item.consumption.push({date, quantity: qty, note});
      // 如果消耗完，自动标记为已用完
      const totalConsumed = alreadyConsumed + qty;
      if(totalConsumed >= item.quantity) item.status = '已用完';
      save(); toast('已记录消耗'); overlay.remove(); navigate('stock-overview');
    });
  });
  // 忽略过期提醒
  document.querySelectorAll("[data-dismiss-expiry]").forEach(b=>b.addEventListener("click",()=>{
    const idx = num(b.dataset.dismissExpiry);
    const item = state.stock[idx];
    if(item){ item.dismissedExpiry = true; save(); navigate('stock-overview'); }
  }));
}

function bindStockAdd(){
  const catSel = document.getElementById("sCategory");
  const subSel = document.getElementById("sSubcategory");
  const unitSel = document.getElementById("sUnit");
  const foodField = document.getElementById("foodBestBefore");
  function updateSubAndUnit(){
    const cat = catSel.value;
    const subs = STOCK_SUBCATEGORIES[cat] || [];
    subSel.innerHTML = subs.map(s=>`<option value="${s}">${s}</option>`).join("");
    const units = STOCK_UNITS[cat] || ["个"];
    unitSel.innerHTML = units.map(u=>`<option value="${u}">${u}</option>`).join("");
    refreshPickerDisplay(subSel);
    refreshPickerDisplay(unitSel);
    foodField.style.display = cat === "食品" ? "flex" : "none";
  }
  catSel.addEventListener("change", updateSubAndUnit);
  updateSubAndUnit();

  // 照片预览
  const photoInput = document.getElementById("stockPhoto");
  let pendingPhoto = null;
  if(photoInput) photoInput.addEventListener("change",()=>{
    const file = photoInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ pendingPhoto = reader.result; document.getElementById("stockPhotoPreview").innerHTML = `<img class="preview-img" src="${pendingPhoto}">`; };
    reader.readAsDataURL(file);
  });

  // AI识图（独立功能入口）
  const aiBtn = document.getElementById("stockAiBtn");
  if(aiBtn) aiBtn.addEventListener("click", async ()=>{
    if(!pendingPhoto){ toast("请先选择实物照片"); return; }
    aiBtn.disabled = true; aiBtn.textContent = "识别中…";
    try{
      const info = await recognizeProduct(pendingPhoto);
      if(info){
        const f = document.getElementById("stockForm");
        if(info.name) f["s-name"].value = info.name;
        if(info.category && STOCK_CATEGORIES.includes(info.category)){
          catSel.value = info.category;
          updateSubAndUnit();
        }
        toast("已识别，请核对信息");
      }
    }catch(err){ toast("识别失败："+err.message); }
    finally{ aiBtn.disabled = false; aiBtn.innerHTML = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><circle cx="10" cy="10" r="8"/><path d="M10 6v8M6 10h8"/></svg> AI识图'; }
  });

  // 扫码录入
  const barcodeBtn = document.getElementById("stockBarcodeBtn");
  if(barcodeBtn) barcodeBtn.addEventListener("click", async ()=>{
    if(!('BarcodeDetector' in window)){ toast("当前浏览器不支持扫码功能，请使用Chrome或Edge"); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center';
      overlay.innerHTML = `<video style="max-width:100%;max-height:70vh;border-radius:12px"></video>
        <div style="color:#fff;margin-top:12px;font-size:14px">正在扫描条码…</div>
        <button class="btn ghost" id="barcodeCancel" style="margin-top:12px;color:#fff;border-color:rgba(255,255,255,.3)">取消</button>`;
      overlay.querySelector('video').srcObject = stream;
      document.body.appendChild(overlay);
      const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      let scanned = false;
      const interval = setInterval(async ()=>{
        if(scanned) return;
        try{
          const barcodes = await detector.detect(video);
          if(barcodes.length > 0){
            scanned = true;
            clearInterval(interval);
            stream.getTracks().forEach(t=>t.stop());
            overlay.remove();
            const code = barcodes[0].rawValue;
            document.getElementById("stockForm")["s-name"].value = '扫码: ' + code;
            toast('已识别条码: ' + code);
          }
        }catch(e){}
      }, 500);
      overlay.querySelector('#barcodeCancel').addEventListener('click', ()=>{
        clearInterval(interval);
        stream.getTracks().forEach(t=>t.stop());
        overlay.remove();
      });
    }catch(err){
      if(err.name === 'NotAllowedError'){ toast('请允许相机权限'); return; }
      toast('扫码启动失败: '+err.message);
    }
  });

  // 表单提交
  const f = document.getElementById("stockForm");
  if(!f) return;
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const name = f["s-name"].value.trim();
    if(!name){ toast("请填写名称"); return; }
    const r = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name,
      category: catSel.value,
      subcategory: subSel.value,
      quantity: num(f["s-qty"].value) || 1,
      unit: unitSel.value,
      entryDate: f["s-entryDate"].value,
      productionDate: f["s-prodDate"].value || "",
      expiryDate: f["s-expiryDate"].value || "",
      bestBeforeDate: f["s-bestBefore"] ? (f["s-bestBefore"].value || "") : "",
      storageLocation: f["s-location"].value,
      status: f["s-status"].value,
      photo: pendingPhoto || "",
      notes: f["s-notes"].value.trim(),
      tags: f["s-tags"] ? f["s-tags"].value.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [],
      minStock: num(f["s-minStock"]?.value) || 1,
      consumption: [],
      dismissedExpiry: false,
    };
    state.stock.push(r);
    state.stock.sort((a,b)=>a.name<b.name?-1:a.name>b.name?1:0);
    save(); toast("已保存"); navigate("stock-overview");
  });
}

function bindStockAll(){
  const searchInput = document.getElementById("stockSearch");
  const catFilter = document.getElementById("stockFilterCat");
  const statusFilter = document.getElementById("stockFilterStatus");
  const spaceTop = document.getElementById("stockFilterSpaceTop");
  const spaceSub = document.getElementById("stockFilterSpaceSub");
  const tagFilter = document.getElementById("stockFilterTag");
  // 级联：选中一级空间时更新二级空间下拉
  function updateSubSpaces(){
    const topId = spaceTop.value;
    const topSpaces = (state.settings.spaces.children||[]);
    const found = topSpaces.find(s => s.id === topId);
    const subs = (found && found.children) || [];
    spaceSub.innerHTML = `<option value="">全部二级空间</option>${subs.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}`;
    refreshPickerDisplay(spaceSub);
    filterAndRender();
  }
  function filterAndRender(){
    const q = (searchInput.value||"").trim().toLowerCase();
    const cat = catFilter.value;
    const st = statusFilter.value;
    const topId = spaceTop.value;
    const subId = spaceSub ? spaceSub.value : '';
    const tg = tagFilter ? tagFilter.value : '';
    let filtered = state.stock;
    if(q) filtered = filtered.filter(i=>i.name.toLowerCase().includes(q));
    if(cat) filtered = filtered.filter(i=>i.category===cat);
    if(st) filtered = filtered.filter(i=>i.status===st);
    // 级联空间过滤
    if(topId){
      // 找到该一级空间及其所有子空间的ID
      const topSpaces = (state.settings.spaces.children||[]);
      const topNode = topSpaces.find(s => s.id === topId);
      const ids = getAllSpaceIds(topNode);
      if(subId){
        filtered = filtered.filter(i => i.storageLocation === subId);
      } else {
        filtered = filtered.filter(i => i.storageLocation && ids.includes(i.storageLocation));
      }
    }
    if(tg) filtered = filtered.filter(i => i.tags && i.tags.includes(tg));
    document.getElementById("stockList").innerHTML = renderStockList(filtered);
    bindStockActions();
  }
  searchInput.addEventListener("input", filterAndRender);
  catFilter.addEventListener("change", filterAndRender);
  statusFilter.addEventListener("change", filterAndRender);
  if(spaceTop) spaceTop.addEventListener("change", updateSubSpaces);
  if(spaceSub) spaceSub.addEventListener("change", filterAndRender);
  if(tagFilter) tagFilter.addEventListener("change", filterAndRender);
  filterAndRender();
  bindStockActions();
}

/* ============== 页面：空间管理 ============== */
function pageStockSpaces(){
  const tree = state.settings.spaces;
  const countMap = {};
  state.stock.forEach(i => { countMap[i.storageLocation] = (countMap[i.storageLocation]||0) + 1; });
  function renderNode(nodes, depth){
    return nodes.map(n => {
      const cnt = countMap[n.id] || 0;
      const sub = n.children && n.children.length ? renderNode(n.children, depth+1) : '';
      const indent = depth * 24;
      return `<div style="position:relative${depth>0?';padding-left:'+indent+'px':''}">
        ${depth>0 ? `<div style="position:absolute;left:${indent-20}px;top:0;bottom:0;width:1px;background:var(--line)"></div>
          <div style="position:absolute;left:${indent-20}px;top:22px;width:12px;height:1px;background:var(--line)"></div>` : ''}
        <div class="card" style="padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:3px solid ${depth===0?'var(--gold)':depth===1?'var(--sage)':'var(--sky)'}">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--ink-muted)">
            ${depth===0
              ? '<path d="M2 6l8-4 8 4v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M2 6l8 4 8-4"/><path d="M10 10v10"/>'
              : depth===1
                ? '<rect x="2" y="4" width="16" height="14" rx="1"/><path d="M2 8h16"/><path d="M8 4v14"/>'
                : '<rect x="3" y="3" width="14" height="14" rx="1"/><path d="M3 8h14"/>'}
          </svg>
          <div style="flex:1;min-width:0">
            <div style="font-weight:${depth===0?600:500};font-size:14px;color:var(--ink)">${esc(n.name)}</div>
            <span style="font-size:12px;color:var(--ink-muted)">${cnt ? cnt+' 件物品' : '空'}</span>
          </div>
          <button class="del" data-add-child="${n.id}" title="新增子空间">+</button>
          ${n.id !== 'root' ? `<button class="del" data-del-space="${n.id}" title="删除">×</button>` : ''}
        </div>
        ${sub}
      </div>`;
    }).join('');
  }
  return `<div class="card">
    <h2 style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-dark)"><path d="M2 6l8-4 8 4v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/><path d="M2 6l8 4 8-4"/><path d="M10 10v10"/></svg>
      空间管理
    </h2>
    <div id="spaceTreePage">${tree.children.length ? renderNode(tree.children, 0) : '<div class="empty" style="padding:20px 0">暂无空间，点击下方添加</div>'}</div>
    <div style="text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
      <button class="btn primary" id="addRootSpacePage" style="min-width:160px">+ 添加一级空间</button>
    </div>
  </div>`;
}

function bindStockSpaces(){
  function findNode(nodes, id){
    for(const n of nodes){
      if(n.id === id) return n;
      if(n.children){
        const f = findNode(n.children, id);
        if(f) return f;
      }
    }
    return null;
  }
  function genId(){ return 'sp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function showInputDialog(title, callback){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = `<div class="card" style="max-width:340px;width:90%;margin:0">
      <h3 style="margin-bottom:12px">${title}</h3>
      <div class="field"><input type="text" id="dialogInput" placeholder="输入名称" style="width:100%;font-size:14px"></div>
      <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn primary" id="dialogOk">确定</button>
        <button class="btn ghost" id="dialogCancel">取消</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#dialogInput');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') overlay.querySelector('#dialogOk').click(); });
    overlay.querySelector('#dialogOk').addEventListener('click', ()=>{
      const val = input.value.trim();
      overlay.remove();
      callback(val);
    });
    overlay.querySelector('#dialogCancel').addEventListener('click', ()=>{
      overlay.remove();
      callback('');
    });
  }
  document.querySelectorAll("[data-add-child]").forEach(b => b.addEventListener("click", ()=>{
    const pid = b.dataset.addChild;
    const parent = findNode([state.settings.spaces], pid);
    if(!parent) return;
    showInputDialog('新增子空间', name => {
      if(!name) return;
      if(!parent.children) parent.children = [];
      parent.children.push({id: genId(), name: name.trim(), children: []});
      save(); navigate('stock-spaces');
    });
  }));
  document.querySelectorAll("[data-del-space]").forEach(b => b.addEventListener("click", ()=>{
    const id = b.dataset.delSpace;
    if(!confirm('确定删除此空间及其子空间？')) return;
    // 收集所有将被删除的空间ID（含子空间）
    const idsToRemove = new Set();
    function collectIds(nodes){
      for(const n of nodes){
        idsToRemove.add(n.id);
        if(n.children && n.children.length) collectIds(n.children);
      }
    }
    function findNodeById(nodes, tid){
      for(const n of nodes){
        if(n.id === tid) return n;
        if(n.children){ const f = findNodeById(n.children, tid); if(f) return f; }
      }
      return null;
    }
    const target = findNodeById([state.settings.spaces], id);
    if(target) collectIds([target]);
    function rm(nodes, tid){
      for(let i=nodes.length-1; i>=0; i--){
        if(nodes[i].id === tid){ nodes.splice(i,1); return true; }
        if(nodes[i].children && rm(nodes[i].children, tid)) return true;
      }
      return false;
    }
    rm([state.settings.spaces], id);
    // 清理指向被删除空间的物品引用
    state.stock.forEach(item => {
      if(idsToRemove.has(item.storageLocation)) item.storageLocation = '';
    });
    save(); navigate('stock-spaces');
  }));
  const addRoot = document.getElementById("addRootSpacePage");
  if(addRoot) addRoot.addEventListener("click", ()=>{
    showInputDialog('添加一级空间', name => {
      if(!name) return;
      state.settings.spaces.children.push({id: genId(), name: name.trim(), children: []});
      save(); navigate('stock-spaces');
    });
  });
}

/* ============== Gist 同步 ============== */
function getSyncData(){
  const d = {...state};
  delete d.settings; // 不上传 token 和偏好设置
  return d;
}
function fmtTime(t){
  if(!t) return "从未同步";
  const d=new Date(t);
  return d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0")+" "+d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
}
// 数据记录数（用于判断哪份数据更全）
function countRecords(d){
  let n = 0;
  ["periods","salary","housingAllowance","weight","measure","diet","exercise","stock"].forEach(k=>{
    if(Array.isArray(d[k])) n += d[k].length;
  });
  return n;
}
// 自动发现云端已有的工作台 Gist（取数据最全的一个）
async function findGist(){
  const token=state.settings.gistToken;
  if(!token) return null;
  glog("findGist: 开始查找云端 Gist...");
  try{
    const res = await fetch("https://api.github.com/gists?per_page=100", {
      headers:{"Authorization":"Bearer "+token}
    });
    if(!res.ok){ glog("findGist: 列表接口失败 HTTP "+res.status); return null; }
    const gists = await res.json();
    glog("findGist: 共 "+gists.length+" 个 Gist");
    let best=null, bestCount=-1;
    for(const g of gists){
      if(!g.files || !g.files["workbench-data.json"]) continue;
      // 列表接口不含 content，需用详细接口获取内容
      let d=null;
      try{
        const detail = await fetch("https://api.github.com/gists/"+g.id, {
          headers:{"Authorization":"Bearer "+token}
        });
        if(!detail.ok) continue;
        const full = await detail.json();
        const content = full.files && full.files["workbench-data.json"] && full.files["workbench-data.json"].content;
        if(!content) continue;
        d = JSON.parse(content);
      }catch(e){ continue; }
      const c = countRecords(d);
      glog("findGist: "+g.id.slice(0,8)+" 记录数="+c);
      if(c > bestCount){ best=g; bestCount=c; }
    }
    if(best) glog("findGist: 选定 "+best.id.slice(0,8)+"（"+bestCount+" 条）");
    else glog("findGist: 未找到任何数据 Gist");
    return best;
  }catch(e){ glog("findGist: 异常 "+e.message); return null; }
}
// 合并远程数据：远程数据更全或更新时覆盖本地（保留本地 settings）
function mergeRemote(remote){
  if(!remote || !remote.meta) return false;
  const lc = countRecords(state);
  const rc = countRecords(remote);
  const remoteNewer = remote.meta.lastModified > state.meta.lastModified;
  const useRemote = (rc > 0 && lc === 0) || (rc > 0 && lc > 0 && remoteNewer) || (rc === 0 && lc === 0 && remoteNewer);
  if(!useRemote) return false;
  const localSettings = state.settings;
  Object.assign(state, remote);
  state.settings = localSettings;
  state.meta.lastModified = remote.meta.lastModified;
  return true;
}
function updateSyncStatus(){
  const el=document.getElementById("gistStatus");
  if(!el) return;
  const s=state.settings;
  const dbg=document.getElementById("gistDebugBox");
  if(dbg){
    dbg.style.display = s.gistDebug ? "block" : "none";
    dbg.textContent = s.gistDebug || "";
  }
  if(!s.gistToken){ el.textContent="未配置 Token，请在输入框填写后保存。"; return; }
  if(!s.gistId){ el.textContent="Token 已保存，点击「立即同步」自动连接云端并同步数据。"; return; }
  const status = s.gistLastSyncStatus;
  const time = fmtTime(s.gistLastSync);
  if(status==="ok") el.textContent="✅ 上次同步成功："+time;
  else if(status && status.startsWith("error")) el.textContent="❌ 同步失败："+status.slice(6)+"（"+time+"）";
  else el.textContent="⏳ 状态未知";
}
function persistGistState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
// 同步调试日志（写入 localStorage，设置页可见）
function glog(msg){
  try{
    const t = new Date();
    const time = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+":"+String(t.getSeconds()).padStart(2,"0");
    state.settings.gistDebug = time+" "+msg+"\n"+(state.settings.gistDebug||"").slice(0,600);
    persistGistState();
  }catch(e){}
}
// 解析目标 Gist：优先云端数据最全的 Gist，否则沿用当前 ID
async function resolveGist(){
  const token=state.settings.gistToken;
  if(!token) return null;
  const found = await findGist();
  let foundCount = -1;
  if(found){
    // 列表接口不含 content，需重新拉取详细数据计算记录数
    const fd = await pullFromGist(found.id);
    if(fd) foundCount = countRecords(fd);
  }
  const curId = state.settings.gistId;
  if(!curId){
    if(found){ state.settings.gistId = found.id; persistGistState(); glog("resolveGist: 绑定 "+found.id.slice(0,8)); return found.id; }
    return null; // 需要新建
  }
  if(found && curId === found.id) return curId;
  // 比较当前 Gist 与云端最全 Gist 的数据量
  let curCount = 0;
  const cur = await pullFromGist(curId);
  if(cur) curCount = countRecords(cur);
  glog("resolveGist: 云端最全="+foundCount+"，当前="+curCount);
  if(foundCount > curCount){
    state.settings.gistId = found.id;
    persistGistState();
    glog("resolveGist: 切换到 "+found.id.slice(0,8));
    return found.id;
  }
  return curId;
}
async function syncToGist(){
  const token=state.settings.gistToken;
  if(!token) return;
  glog("syncToGist: 开始同步");
  try{
    // 1. 确定目标 Gist：自动发现云端最全的，没有则创建
    let gistId = await resolveGist();
    glog("syncToGist: 目标 gistId="+(gistId||"无"));
    if(!gistId){
      glog("syncToGist: 创建新 Gist...");
      const createRes = await fetch("https://api.github.com/gists", {
        method:"POST",
        headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
        body:JSON.stringify({description:"工作台数据同步", public:false, files:{"workbench-data.json":{content:"{}"}}})
      });
      if(!createRes.ok){ glog("syncToGist: 创建失败 HTTP "+createRes.status); throw new Error("HTTP "+createRes.status); }
      const g = await createRes.json();
      gistId = g.id;
      state.settings.gistId = gistId;
      glog("syncToGist: 已创建 "+gistId.slice(0,8));
    }
    // 2. 上传前先拉取云端数据，更全或更新则先合并
    glog("syncToGist: 拉取云端数据...");
    const remote = await pullFromGist(gistId);
    if(remote) glog("syncToGist: 云端记录数="+countRecords(remote));
    const merged = remote ? mergeRemote(remote) : false;
    glog("syncToGist: 合并结果="+merged+"，本地记录数="+countRecords(state));
    // 3. 上传（合并后的）数据
    const body = JSON.stringify(getSyncData(), null, 2);
    const res = await fetch("https://api.github.com/gists/"+gistId, {
      method:"PATCH",
      headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify({files:{"workbench-data.json":{content:body}}})
    });
    if(!res.ok){ const err=await res.text(); glog("syncToGist: 上传失败 HTTP "+res.status); throw new Error("HTTP "+res.status); }
    glog("syncToGist: 上传成功");
    state.settings.gistId = gistId;
    state.settings.gistLastSync=Date.now();
    state.settings.gistLastSyncStatus="ok";
    persistGistState();
    updateSyncStatus();
    toast(merged ? "已合并云端数据并同步" : "同步成功");
    // 若合并了远程数据，刷新当前页面显示
    if(merged && currentPage) navigate(currentPage);
  }catch(e){
    glog("syncToGist: 异常 "+e.message);
    state.settings.gistLastSync=Date.now();
    state.settings.gistLastSyncStatus="error:"+e.message;
    persistGistState();
    updateSyncStatus();
    toast("同步失败："+e.message);
  }
}
async function pullFromGist(gistId){
  const token=state.settings.gistToken;
  if(!token) return null;
  try{
    if(!gistId){
      const found = await findGist();
      if(!found) return null;
      gistId = found.id;
      state.settings.gistId = gistId;
      persistGistState();
    }
    const res = await fetch("https://api.github.com/gists/"+gistId, {
      headers:{"Authorization":"Bearer "+token}
    });
    if(!res.ok){ glog("pullFromGist: 获取失败 HTTP "+res.status); return null; }
    const gist = await res.json();
    const content = gist.files && gist.files["workbench-data.json"] && gist.files["workbench-data.json"].content;
    if(!content){ glog("pullFromGist: 文件内容为空"); return null; }
    return JSON.parse(content);
  }catch(e){ glog("pullFromGist: 异常 "+e.message); return null; }
}
async function initSync(){
  const s=state.settings;
  if(!s.gistToken) return;
  glog("initSync: 启动拉取");
  const gistId = await resolveGist();
  if(!gistId){ glog("initSync: 无目标 Gist"); return; }
  const remote = await pullFromGist(gistId);
  const merged = remote ? mergeRemote(remote) : false;
  glog("initSync: 合并="+merged+"，本地记录数="+countRecords(state));
  if(merged){
    save(); // 写回 localStorage
    toast("已从云端同步最新数据");
    if(currentPage) navigate(currentPage);
  }
  s.gistLastSync=Date.now();
  s.gistLastSyncStatus="ok";
  persistGistState();
  updateSyncStatus();
}
