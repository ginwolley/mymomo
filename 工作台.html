/* 构建食物历史索引（普通食物 + 包装食品分开） */
function buildFoodHistory(){
  const foodHistory = {}; // name -> {name, baseKcal, unit, lastUsed}
  const pkgHistory = {};  // name -> {name, kjPer100g, unit, lastUsed}
  state.diet.forEach(d => {
    (d.items || []).forEach(item => {
      const isPkg = item.isPackage || false;
      const key = (item.name || '').trim().toLowerCase();
      if(!key) return;
      if(isPkg){
        if(!pkgHistory[key]){
          pkgHistory[key] = {
            name: item.name,
            kjPer100g: item.kjPer100g || 0,
            unit: item.unit || 'g',
            lastUsed: d.date
          };
        }
      } else {
        if(!foodHistory[key]){
          const baseKcal = item.baseKcal || Math.round(item.kcal / Math.max(item.qty || 100, 1) * 100);
          foodHistory[key] = {
            name: item.name,
            baseKcal,
            unit: item.unit || 'g',
            lastUsed: d.date
          };
        }
      }
    });
  });
  return { foodHistory, pkgHistory };
}

function bindDietAdd(){
  const pageEl = document.getElementById("page");
  const dietAddPage = pageEl.querySelector(".diet-add-page");
  if(!dietAddPage) return;
  const meal = dietAddPage.dataset.meal || "lunch";

  // 构建历史索引
  const { foodHistory, pkgHistory } = buildFoodHistory();

  // 份量选择面板状态
  let selectedFood = null;

  // ============== 份量选择面板 ==============
  function updateFdKcal(){
    if(!selectedFood) return;
    const qty = num(document.getElementById("fdQty").value) || 0;
    const unit = selectedFood.unit;
    let ratio = 1;
    if(unit.includes("g") || unit.includes("ml")){
      const base = parseInt(unit) || 100;
      ratio = qty / base;
    } else {
      ratio = qty;
    }
    document.getElementById("fdKcal").textContent = Math.round(selectedFood.kcal * ratio);
  }

  function showFoodDetailPanel(name, kcalPer100g, unit, showSuggestions){
    selectedFood = {name, kcal: kcalPer100g, unit: "g"};
    const panel = document.getElementById("foodDetailPanel");
    document.getElementById("fdName").textContent = name;
    document.getElementById("fdBase").textContent = `${kcalPer100g} kcal / 100g`;
    document.getElementById("fdQty").value = 100;
    document.getElementById("fdUnitLabel").textContent = "g";

    // 份量建议按钮
    const sug = document.getElementById("fdServingSuggestions");
    if(showSuggestions && sug){
      sug.style.display = "block";
      sug.innerHTML = '<span class="muted" style="font-size:11px;margin-right:4px">建议份量:</span>' +
        '<button class="btn ghost sm" data-qty="80">一人份(80g)</button>' +
        '<button class="btn ghost sm" data-qty="150">小份(150g)</button>' +
        '<button class="btn ghost sm" data-qty="250">大份(250g)</button>';
      sug.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", ()=>{
          document.getElementById("fdQty").value = btn.dataset.qty;
          updateFdKcal();
        });
      });
    } else if(sug){
      sug.style.display = "none";
    }

    updateFdKcal();
    panel.style.display = "block";
    panel.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  document.getElementById("fdQty").addEventListener("input", updateFdKcal);

  document.getElementById("fdAdd").addEventListener("click", ()=>{
    if(!selectedFood) return;
    const qty = num(document.getElementById("fdQty").value) || 0;
    const unit = selectedFood.unit;
    let ratio = 1;
    if(unit.includes("g") || unit.includes("ml")){
      const base = parseInt(unit) || 100;
      ratio = qty / base;
    } else {
      ratio = qty;
    }
    const totalKcal = Math.round(selectedFood.kcal * ratio);
    const foodName = selectedFood.name;
    const d = ensureDay(state.diet, todayStr());
    d.items.push({name: foodName, kcal: totalKcal, meal, unit, qty, img: null});
    save(); document.getElementById("foodDetailPanel").style.display = "none"; selectedFood = null;
    toast("已添加 "+foodName); navigate("diet");
  });

  document.getElementById("fdCancel").addEventListener("click", ()=>{
    document.getElementById("foodDetailPanel").style.display = "none";
    selectedFood = null;
  });

  // ============== 搜索食物（历史联想 + AI估算） ==============
  const searchInput = document.getElementById("searchFoodInput");
  const searchHistory = document.getElementById("searchFoodHistory");
  const searchBtn = document.getElementById("searchFoodBtn");
  const searchHint = document.getElementById("searchFoodHint");

  if(searchInput){
    searchInput.addEventListener("input", ()=>{
      const val = searchInput.value.trim().toLowerCase();
      if(!val){ searchHistory.style.display = "none"; if(searchHint) searchHint.textContent = ""; return; }
      const matches = Object.values(foodHistory)
        .filter(f => f.name.toLowerCase().includes(val))
        .sort((a, b) => (a.lastUsed || "") > (b.lastUsed || "") ? -1 : 1)
        .slice(0, 8);
      if(matches.length === 0){ searchHistory.style.display = "none"; if(searchHint) searchHint.textContent = "未找到历史记录，点击搜索使用AI估算"; return; }
      if(searchHint) searchHint.textContent = `找到 ${matches.length} 条历史记录，点击可直接填入`;
      searchHistory.innerHTML = matches.map(f =>
        '<div class="fh-item" data-name="'+esc(f.name)+'" data-kcal="'+f.baseKcal+'" data-unit="'+esc(f.unit)+'">' +
          '<span class="fh-name">'+esc(f.name)+'</span>' +
          '<span class="fh-info">'+f.baseKcal+' kcal/100g</span>' +
        '</div>'
      ).join("");
      searchHistory.style.display = "block";
    });
    searchHistory.addEventListener("click", (e)=>{
      const item = e.target.closest(".fh-item");
      if(!item) return;
      searchHistory.style.display = "none";
      searchInput.value = "";
      if(searchHint) searchHint.textContent = "";
      showFoodDetailPanel(item.dataset.name, parseFloat(item.dataset.kcal), item.dataset.unit || "g", false);
    });
  }

  if(searchBtn){
    searchBtn.addEventListener("click", async ()=>{
      const val = searchInput.value.trim();
      if(!val){ toast("请输入食物名称"); return; }
      // 先精确匹配历史
      const key = val.toLowerCase();
      if(foodHistory[key]){
        const f = foodHistory[key];
        showFoodDetailPanel(f.name, f.baseKcal, f.unit, false);
        if(searchHint) searchHint.textContent = "";
        searchInput.value = "";
        return;
      }
      // 未匹配 → AI估算
      if(!(state.settings.api.enabled && state.settings.api.key)){
        toast("未在历史中找到，请先在设置中开启AI识别");
        return;
      }
      searchBtn.disabled = true; searchBtn.textContent = "估算中…";
      try{
        const result = await recognizeDish(val);
        if(result && result.name && result.kcal > 0){
          showFoodDetailPanel(result.name, result.kcal, "g", true);
          if(searchHint) searchHint.textContent = "";
          searchInput.value = "";
        } else {
          toast("AI未能估算，请尝试更具体的菜名");
        }
      }catch(err){ toast("估算失败：" + err.message); }
      finally{ searchBtn.disabled = false; searchBtn.textContent = "搜索"; }
    });
  }

  // ============== 包装食品 ==============
  function calcPkgKcal(){
    const w = num(document.getElementById("pkgWeight").value);
    const kj = num(document.getElementById("pkgKj").value);
    if(w > 0 && kj > 0){
      const kcal = Math.round((w / 100) * (kj / 4.184));
      document.getElementById("pkgKcal").textContent = kcal;
    } else {
      document.getElementById("pkgKcal").textContent = "0";
    }
  }
  const pkgWeight = document.getElementById("pkgWeight");
  const pkgKj = document.getElementById("pkgKj");
  if(pkgWeight) pkgWeight.addEventListener("input", calcPkgKcal);
  if(pkgKj) pkgKj.addEventListener("input", calcPkgKcal);

  // 包装食品品名输入 + 历史联想
  const pkgNameInput = document.getElementById("pkgNameInput");
  const pkgFoodHistory = document.getElementById("pkgFoodHistory");
  if(pkgNameInput){
    pkgNameInput.addEventListener("input", ()=>{
      const val = pkgNameInput.value.trim().toLowerCase();
      if(!val){ pkgFoodHistory.style.display = "none"; return; }
      const matches = Object.values(pkgHistory)
        .filter(f => f.name.toLowerCase().includes(val))
        .sort((a, b) => (a.lastUsed || "") > (b.lastUsed || "") ? -1 : 1)
        .slice(0, 8);
      if(matches.length === 0){ pkgFoodHistory.style.display = "none"; return; }
      pkgFoodHistory.innerHTML = matches.map(f =>
        '<div class="fh-item" data-name="'+esc(f.name)+'" data-kj="'+f.kjPer100g+'" data-unit="'+esc(f.unit)+'">' +
          '<span class="fh-name">'+esc(f.name)+'</span>' +
          '<span class="fh-info">'+f.kjPer100g+' kJ/100'+esc(f.unit)+'</span>' +
        '</div>'
      ).join("");
      pkgFoodHistory.style.display = "block";
    });
    pkgFoodHistory.addEventListener("click", (e)=>{
      const item = e.target.closest(".fh-item");
      if(!item) return;
      pkgFoodHistory.style.display = "none";
      pkgNameInput.value = item.dataset.name;
      document.getElementById("pkgKj").value = item.dataset.kj;
      // 同步单位切换
      const unit = item.dataset.unit || "g";
      document.querySelectorAll("#pkgUnitTog button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.unit === unit);
      });
      toast("已填入"+item.dataset.name+"，请修改净含量");
      calcPkgKcal();
    });
  }

  // 包装食品单位切换
  document.querySelectorAll("#pkgUnitTog button").forEach(btn => {
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#pkgUnitTog button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      calcPkgKcal();
    });
  });

  const pkgUseBtn = document.getElementById("pkgUseBtn");
  if(pkgUseBtn) pkgUseBtn.addEventListener("click", ()=>{
    const name = (pkgNameInput && pkgNameInput.value.trim()) || "包装食品";
    const w = num(document.getElementById("pkgWeight").value);
    const kj = num(document.getElementById("pkgKj").value);
    if(w <= 0 || kj <= 0){ toast("请先填写净含量和每100g千焦"); return; }
    const unitEl = document.querySelector("#pkgUnitTog .active");
    const unit = (unitEl && unitEl.dataset.unit) || "g";
    const kcal = Math.round((w / 100) * (kj / 4.184));
    const d = ensureDay(state.diet, todayStr());
    d.items.push({name, kcal, meal, unit, qty: w, isPackage: true, kjPer100g: kj, img: null});
    save(); toast("已添加 "+name+" "+kcal+" kcal"); navigate("diet");
  });

}

/* AI菜名估算（文本输入） */
async function recognizeDish(dishName){
  const {endpoint, key, model} = state.settings.api;
  const body={
    model,
    messages:[
      {role:"system", content:"你是中国饮食营养专家。请估算以下中式菜肴每100克的热量。只返回一个JSON对象，格式为 {\"name\":\"菜名\",\"kcal\":数值}，不要任何其他文字。kcal代表每100克的热量值，确保是整数。"},
      {role:"user", content:dishName}
    ],
    temperature:0.2,
  };
  const res=await fetch(endpoint, {
    method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer "+key},
    body:JSON.stringify(body),
  });
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("接口返回 "+res.status+" "+t.slice(0,120)); }
  const json=await res.json();
  const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
  if(!content) throw new Error("接口未返回内容");
  let s=content.trim();
  try{ return JSON.parse(s); }catch(e){}
  const m=s.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  throw new Error("无法解析AI返回结果");
}

function bindExercise(){
  const form=document.getElementById("exerciseForm");
  if(!form) return;
  const typeSelect = form.type;
  const preview=document.getElementById("exPreview");
  // 通过 select option 的 data-met 读取 MET，或者回退匹配
  function lookupMET(name){
    name = name.trim();
    for(const g of EX_TYPES){
      for(const item of g.items){
        if(item[0] === name) return item[1];
      }
    }
    return null;
  }
  function currentMET(){
    const sel = typeSelect.selectedOptions?.[0];
    if(sel && sel.dataset.met) return parseFloat(sel.dataset.met);
    const met = lookupMET(typeSelect.value);
    return met ?? 5.0;
  }
  function updatePreview(){
    const met = currentMET();
    const dur = num(form.duration.value);
    const w = weightForCalc();
    if(dur && dur>0){
      preview.textContent = `预计消耗约 ${round(met*w*dur/60)} kcal（${round(met)} MET × ${round(w)}kg × ${dur}分）`;
    } else {
      preview.textContent = "";
    }
  }
  typeSelect.addEventListener("change", updatePreview);
  form.duration.addEventListener("input", updatePreview);

  form.addEventListener("submit", e=>{
    e.preventDefault();
    const type = typeSelect.value.trim();
    if(!type){ toast("请选择运动方式"); return; }
    const met = currentMET();
    const duration = num(form.duration.value);
    const w = weightForCalc();
    if(!duration || duration<=0){ toast("请填写有效时长"); return; }
    const kcal = round(met * w * duration / 60);
    const d = ensureDay(state.exercise, todayStr());
    d.items.push({type, duration, kcal, note:form.note.value.trim()});
    save(); toast("已保存，消耗约 "+kcal+" kcal"); navigate("exercise");
  });
  updatePreview();
  document.querySelectorAll("[data-del-ex]").forEach(b=>b.addEventListener("click",()=>{
    const d=getDay(state.exercise, todayStr()); if(d) d.items.splice(num(b.dataset.delEx),1); save(); navigate("exercise");
  }));
  const rbtn=document.getElementById("resetExToday");
  if(rbtn) rbtn.addEventListener("click",()=>{
    if(confirm("确定清空今日运动记录？")){ const d=getDay(state.exercise, todayStr()); if(d) d.items=[]; save(); navigate("exercise"); }
  });
  document.getElementById("exViewAllBtn")?.addEventListener("click",()=> navigate("exercise-all"));
}

      }
    } else {
      if(ui.editingPeriod && ui.editingPeriod.start === selDate){

/* ============== 囤货辅助函数 ============== */
function flattenSpaceTree(nodes, parentPath=''){
  let r = [];
  for(const n of nodes){
    const p = parentPath ? parentPath + ' > ' + n.name : n.name;
    if(n.id !== 'root') r.push({id:n.id, path:p, name:n.name});
    if(n.children && n.children.length) r = r.concat(flattenSpaceTree(n.children, p));
  }
  return r;
}
function getSpacePath(id){
  if(!id) return '';
  const all = flattenSpaceTree([state.settings.spaces]);
  const f = all.find(s => s.id === id);
  return f ? f.path : '';
}
function getAllSpaceIds(node){
  let ids = [node.id];
  if(node.children && node.children.length){
    node.children.forEach(c => { ids = ids.concat(getAllSpaceIds(c)); });
  }
  return ids;
}
function spaceOptsHtml(selId=''){
  return flattenSpaceTree([state.settings.spaces]).map(s => `<option value="${s.id}" ${s.id===selId?'selected':''}>${s.path}</option>`).join('');
}
function renderSpaceTreeEdit(nodes, depth=0){
  const pad = depth * 16;
  return nodes.map(n => `<div class="space-node" style="margin-left:${pad}px;display:flex;align-items:center;gap:8px;padding:4px 0">
    <span>${esc(n.name)}</span>
    <button class="del" data-add-child="${n.id}">+</button>
    ${n.id !== 'root' ? `<button class="del" data-del-space="${n.id}">×</button>` : ''}
    ${n.children && n.children.length ? renderSpaceTreeEdit(n.children, depth+1) : ''}
  </div>`).join('');
}

function renderStockList(items){
  if(!items.length) return '<div class="empty" style="padding:24px 20px"><svg viewBox="0 0 20 20" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px;color:var(--ink-muted)"><rect x="3" y="3" width="14" height="16" rx="2"/><path d="M3 8h14"/><path d="M10 3v18"/></svg>暂无囤货记录</div>';
  // 按空间分组
  const groups = {};
  items.forEach(r => {
    const sp = r.storageLocation || '未指定';
    if(!groups[sp]) groups[sp] = [];
    groups[sp].push(r);
  });
  // 空间排序：按路径
  const spaceOrder = Object.keys(groups).sort((a,b) => {
    const pa = getSpacePath(a) || a;
    const pb = getSpacePath(b) || b;
    return pa.localeCompare(pb);
  });
  return spaceOrder.map(sp => {
    const itemCards = groups[sp].slice().reverse().map(r => {
      const idx = state.stock.indexOf(r);
      const expCls = r.expiryDate && daysBetween(todayStr(), r.expiryDate) <= 30 ? ' style="color:var(--danger)"' : '';
      const lowStock = r.quantity <= (r.minStock || 1) && r.status !== '已用完';
      const tags = (r.tags||[]).map(t => `<span class="pill" style="font-size:10px;padding:1px 6px;margin:0 2px 2px 0">${esc(t)}</span>`).join('');

/* ============== 囤货事件绑定 ============== */
function bindStockOverview(){
  const goAdd = document.getElementById("goStockAdd");
  if(goAdd) goAdd.addEventListener("click",()=>{ navigate("stock-add"); });
  const goConsume = document.getElementById("goConsumeBtn");
  if(goConsume) goConsume.addEventListener("click", ()=>{
    // 弹出消耗录入对话框
    const items = state.stock.filter(i => i.status !== '已用完');
    if(!items.length){ toast("没有可消耗的物品"); return; }
    const itemOpts = items.map((i,idx) => `<option value="${state.stock.indexOf(i)}">${esc(i.name)} (剩余 ${i.quantity} ${i.unit})</option>`).join('');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = `<div class="card" style="max-width:380px;width:90%;margin:0">
      <h3>录入消耗</h3>
      <div class="field"><label>物品</label><select id="consumeItem">${itemOpts}</select></div>
      <div class="row">
        <div class="field"><label>数量</label><input type="number" id="consumeQty" value="1" min="1" step="1"></div>
        <div class="field"><label>日期</label><input type="date" id="consumeDate" value="${todayStr()}"></div>
      </div>
      <div class="field"><label>备注</label><input type="text" id="consumeNote" placeholder="可选"></div>
      <div style="text-align:center;margin-top:10px;display:flex;gap:8px;justify-content:center">
        <button class="btn primary" id="consumeSave">保存</button>
        <button class="btn ghost" id="consumeCancel">取消</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    initAllPickers(overlay);
    overlay.querySelector('#consumeCancel').addEventListener('click', ()=>overlay.remove());
    overlay.querySelector('#consumeSave').addEventListener('click', ()=>{
      const idx = num(overlay.querySelector('#consumeItem').value);
      const qty = num(overlay.querySelector('#consumeQty').value);
      const date = overlay.querySelector('#consumeDate').value;
      const note = overlay.querySelector('#consumeNote').value.trim();
      if(!qty || qty < 1){ toast('请输入有效数量'); return; }
      const item = state.stock[idx];
      if(!item){ toast('物品不存在'); overlay.remove(); return; }
      if(!item.consumption) item.consumption = [];
      const alreadyConsumed = item.consumption.reduce((s,c)=>s+c.quantity, 0);
      const remaining = item.quantity - alreadyConsumed;
      if(qty > remaining){ toast('消耗量超过剩余量（剩余 '+remaining+' '+item.unit+'）'); return; }
      item.consumption.push({date, quantity: qty, note});
      // 如果消耗完，自动标记为已用完
      const totalConsumed = alreadyConsumed + qty;
      if(totalConsumed >= item.quantity) item.status = '已用完';
      save(); toast('已记录消耗'); overlay.remove(); navigate('stock-overview');
    });
  });
  // 忽略过期提醒
  document.querySelectorAll("[data-dismiss-expiry]").forEach(b=>b.addEventListener("click",()=>{
    const idx = num(b.dataset.dismissExpiry);
    const item = state.stock[idx];
    if(item){ item.dismissedExpiry = true; save(); navigate('stock-overview'); }
  }));
}

function bindStockAdd(){
  const catSel = document.getElementById("sCategory");
  const subSel = document.getElementById("sSubcategory");
  const unitSel = document.getElementById("sUnit");
  const foodField = document.getElementById("foodBestBefore");
  function updateSubAndUnit(){
    const cat = catSel.value;
    const subs = STOCK_SUBCATEGORIES[cat] || [];
    subSel.innerHTML = subs.map(s=>`<option value="${s}">${s}</option>`).join("");
    const units = STOCK_UNITS[cat] || ["个"];
    unitSel.innerHTML = units.map(u=>`<option value="${u}">${u}</option>`).join("");
    refreshPickerDisplay(subSel);
    refreshPickerDisplay(unitSel);
    foodField.style.display = cat === "食品" ? "flex" : "none";
  }
  catSel.addEventListener("change", updateSubAndUnit);
  updateSubAndUnit();

  // 照片预览
  const photoInput = document.getElementById("stockPhoto");
  let pendingPhoto = null;
  if(photoInput) photoInput.addEventListener("change",()=>{
    const file = photoInput.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ pendingPhoto = reader.result; document.getElementById("stockPhotoPreview").innerHTML = `<img class="preview-img" src="${pendingPhoto}">`; };
    reader.readAsDataURL(file);
  });

  // AI识图（独立功能入口）
  const aiBtn = document.getElementById("stockAiBtn");
  if(aiBtn) aiBtn.addEventListener("click", async ()=>{
    if(!pendingPhoto){ toast("请先选择实物照片"); return; }
    aiBtn.disabled = true; aiBtn.textContent = "识别中…";
    try{
      const info = await recognizeProduct(pendingPhoto);
      if(info){
        const f = document.getElementById("stockForm");
        if(info.name) f["s-name"].value = info.name;
        if(info.category && STOCK_CATEGORIES.includes(info.category)){
          catSel.value = info.category;
          updateSubAndUnit();
        }
        toast("已识别，请核对信息");
      }
    }catch(err){ toast("识别失败："+err.message); }
    finally{ aiBtn.disabled = false; aiBtn.innerHTML = '<svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><circle cx="10" cy="10" r="8"/><path d="M10 6v8M6 10h8"/></svg> AI识图'; }
  });

  // 扫码录入
  const barcodeBtn = document.getElementById("stockBarcodeBtn");
  if(barcodeBtn) barcodeBtn.addEventListener("click", async ()=>{
    if(!('BarcodeDetector' in window)){ toast("当前浏览器不支持扫码功能，请使用Chrome或Edge"); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center';
      overlay.innerHTML = `<video style="max-width:100%;max-height:70vh;border-radius:12px"></video>
        <div style="color:#fff;margin-top:12px;font-size:14px">正在扫描条码…</div>
        <button class="btn ghost" id="barcodeCancel" style="margin-top:12px;color:#fff;border-color:rgba(255,255,255,.3)">取消</button>`;
      overlay.querySelector('video').srcObject = stream;
      document.body.appendChild(overlay);
      const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      let scanned = false;
      const interval = setInterval(async ()=>{
        if(scanned) return;
        try{
          const barcodes = await detector.detect(video);
          if(barcodes.length > 0){
            scanned = true;
            clearInterval(interval);
            stream.getTracks().forEach(t=>t.stop());
            overlay.remove();
            const code = barcodes[0].rawValue;
            document.getElementById("stockForm")["s-name"].value = '扫码: ' + code;
            toast('已识别条码: ' + code);
          }
        }catch(e){}
      }, 500);
      overlay.querySelector('#barcodeCancel').addEventListener('click', ()=>{
        clearInterval(interval);
        stream.getTracks().forEach(t=>t.stop());
        overlay.remove();
      });
    }catch(err){
      if(err.name === 'NotAllowedError'){ toast('请允许相机权限'); return; }
      toast('扫码启动失败: '+err.message);
    }
  });

  // 表单提交
  const f = document.getElementById("stockForm");
  if(!f) return;
  f.addEventListener("submit", e=>{
    e.preventDefault();
    const name = f["s-name"].value.trim();
    if(!name){ toast("请填写名称"); return; }
    const r = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2,6),
      name,
      category: catSel.value,
      subcategory: subSel.value,
      quantity: num(f["s-qty"].value) || 1,
      unit: unitSel.value,
      entryDate: f["s-entryDate"].value,
      productionDate: f["s-prodDate"].value || "",
      expiryDate: f["s-expiryDate"].value || "",
      bestBeforeDate: f["s-bestBefore"] ? (f["s-bestBefore"].value || "") : "",
      storageLocation: f["s-location"].value,
      status: f["s-status"].value,
      photo: pendingPhoto || "",
      notes: f["s-notes"].value.trim(),
      tags: f["s-tags"] ? f["s-tags"].value.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [],
      minStock: num(f["s-minStock"]?.value) || 1,
      consumption: [],
      dismissedExpiry: false,
    };
    state.stock.push(r);
    state.stock.sort((a,b)=>a.name<b.name?-1:a.name>b.name?1:0);
    save(); toast("已保存"); navigate("stock-overview");
  });
}

function bindStockAll(){
  const searchInput = document.getElementById("stockSearch");
  const catFilter = document.getElementById("stockFilterCat");
  const statusFilter = document.getElementById("stockFilterStatus");
  const spaceTop = document.getElementById("stockFilterSpaceTop");
  const spaceSub = document.getElementById("stockFilterSpaceSub");
  const tagFilter = document.getElementById("stockFilterTag");
  // 级联：选中一级空间时更新二级空间下拉
  function updateSubSpaces(){
    const topId = spaceTop.value;
    const topSpaces = (state.settings.spaces.children||[]);
    const found = topSpaces.find(s => s.id === topId);
    const subs = (found && found.children) || [];
    spaceSub.innerHTML = `<option value="">全部二级空间</option>${subs.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}`;
    refreshPickerDisplay(spaceSub);
    filterAndRender();
  }
  function filterAndRender(){
    const q = (searchInput.value||"").trim().toLowerCase();
    const cat = catFilter.value;
    const st = statusFilter.value;
    const topId = spaceTop.value;
    const subId = spaceSub ? spaceSub.value : '';
    const tg = tagFilter ? tagFilter.value : '';
    let filtered = state.stock;
    if(q) filtered = filtered.filter(i=>i.name.toLowerCase().includes(q));
    if(cat) filtered = filtered.filter(i=>i.category===cat);
    if(st) filtered = filtered.filter(i=>i.status===st);
    // 级联空间过滤
    if(topId){
      // 找到该一级空间及其所有子空间的ID
      const topSpaces = (state.settings.spaces.children||[]);
      const topNode = topSpaces.find(s => s.id === topId);
      const ids = getAllSpaceIds(topNode);
      if(subId){
        filtered = filtered.filter(i => i.storageLocation === subId);
      } else {
        filtered = filtered.filter(i => i.storageLocation && ids.includes(i.storageLocation));
      }
    }
    if(tg) filtered = filtered.filter(i => i.tags && i.tags.includes(tg));
    document.getElementById("stockList").innerHTML = renderStockList(filtered);
    bindStockActions();
  }
  searchInput.addEventListener("input", filterAndRender);
  catFilter.addEventListener("change", filterAndRender);
  statusFilter.addEventListener("change", filterAndRender);
  if(spaceTop) spaceTop.addEventListener("change", updateSubSpaces);
  if(spaceSub) spaceSub.addEventListener("change", filterAndRender);
  if(tagFilter) tagFilter.addEventListener("change", filterAndRender);
  filterAndRender();
  bindStockActions();
}

/* ============== 页面：空间管理 ============== */
function pageStockSpaces(){
  const tree = state.settings.spaces;
  const countMap = {};
  state.stock.forEach(i => { countMap[i.storageLocation] = (countMap[i.storageLocation]||0) + 1; });
  function renderNode(nodes, depth){
    return nodes.map(n => {
      const cnt = countMap[n.id] || 0;
      const sub = n.children && n.children.length ? renderNode(n.children, depth+1) : '';
      const indent = depth * 24;
      return `<div style="position:relative${depth>0?';padding-left:'+indent+'px':''}">
        ${depth>0 ? `<div style="position:absolute;left:${indent-20}px;top:0;bottom:0;width:1px;background:var(--line)"></div>
          <div style="position:absolute;left:${indent-20}px;top:22px;width:12px;height:1px;background:var(--line)"></div>` : ''}
        <div class="card" style="padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:3px solid ${depth===0?'var(--gold)':depth===1?'var(--sage)':'var(--sky)'}">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--ink-muted)">
            ${depth===0

function bindStockSpaces(){
  function findNode(nodes, id){
    for(const n of nodes){
      if(n.id === id) return n;
      if(n.children){
        const f = findNode(n.children, id);
        if(f) return f;
      }
    }
    return null;
  }
  function genId(){ return 'sp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function showInputDialog(title, callback){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = `<div class="card" style="max-width:340px;width:90%;margin:0">
      <h3 style="margin-bottom:12px">${title}</h3>
      <div class="field"><input type="text" id="dialogInput" placeholder="输入名称" style="width:100%;font-size:14px"></div>
      <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">
        <button class="btn primary" id="dialogOk">确定</button>
        <button class="btn ghost" id="dialogCancel">取消</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#dialogInput');
    input.focus();
    input.addEventListener('keydown', e => { if(e.key==='Enter') overlay.querySelector('#dialogOk').click(); });
    overlay.querySelector('#dialogOk').addEventListener('click', ()=>{
      const val = input.value.trim();
      overlay.remove();
      callback(val);
    });
    overlay.querySelector('#dialogCancel').addEventListener('click', ()=>{
      overlay.remove();
      callback('');
    });
  }
  document.querySelectorAll("[data-add-child]").forEach(b => b.addEventListener("click", ()=>{
    const pid = b.dataset.addChild;
    const parent = findNode([state.settings.spaces], pid);
    if(!parent) return;
    showInputDialog('新增子空间', name => {
      if(!name) return;
      if(!parent.children) parent.children = [];
      parent.children.push({id: genId(), name: name.trim(), children: []});
      save(); navigate('stock-spaces');
    });
  }));
  document.querySelectorAll("[data-del-space]").forEach(b => b.addEventListener("click", ()=>{
    const id = b.dataset.delSpace;
    if(!confirm('确定删除此空间及其子空间？')) return;
    // 收集所有将被删除的空间ID（含子空间）
    const idsToRemove = new Set();
    function collectIds(nodes){
      for(const n of nodes){
        idsToRemove.add(n.id);
        if(n.children && n.children.length) collectIds(n.children);
      }
    }
    function findNodeById(nodes, tid){
      for(const n of nodes){
        if(n.id === tid) return n;
        if(n.children){ const f = findNodeById(n.children, tid); if(f) return f; }
      }
      return null;
    }
    const target = findNodeById([state.settings.spaces], id);
    if(target) collectIds([target]);
    function rm(nodes, tid){
      for(let i=nodes.length-1; i>=0; i--){
        if(nodes[i].id === tid){ nodes.splice(i,1); return true; }
        if(nodes[i].children && rm(nodes[i].children, tid)) return true;
      }
      return false;
    }
    rm([state.settings.spaces], id);
    // 清理指向被删除空间的物品引用
    state.stock.forEach(item => {
      if(idsToRemove.has(item.storageLocation)) item.storageLocation = '';
    });
    save(); navigate('stock-spaces');
  }));
  const addRoot = document.getElementById("addRootSpacePage");
  if(addRoot) addRoot.addEventListener("click", ()=>{
    showInputDialog('添加一级空间', name => {
      if(!name) return;
      state.settings.spaces.children.push({id: genId(), name: name.trim(), children: []});
      save(); navigate('stock-spaces');
    });
  });
}

/* AI识图 - 识别产品 */
async function recognizeProduct(dataUrl){
  const {endpoint, key, model} = state.settings.api;
  const body = {
    model,
    messages:[
      {role:"system", content:"你是产品识别助手。识别图片中的商品，返回一个JSON对象，格式如 {\"name\":\"清扬男士去屑洗发水\",\"category\":\"护肤品\"}。category只能从以下分类中选择：化妆品、护肤品、日化用品、食品、其他。如果无法识别，返回{\"name\":\"\"}。"},
      {role:"user", content:[{type:"text", text:"识别图中商品名称和分类"}, {type:"image_url", image_url:{url:dataUrl}}]}
    ],
    temperature:0.2,
  };
  const res = await fetch(endpoint, {
    method:"POST",
    headers:{"Content-Type":"application/json", "Authorization":"Bearer "+key},
    body:JSON.stringify(body),
  });
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("接口返回 "+res.status+" "+t.slice(0,120)); }
  const json = await res.json();
  const content = json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
  if(!content) throw new Error("接口未返回内容");
  try{ return JSON.parse(content); }catch(e){
    const m = content.match(/\{[\s\S]*\}/);
    if(m) try{ return JSON.parse(m[0]); }catch(e2){}
    throw new Error("无法解析识别结果");
  }
}

function getPwdCats(){ return (state.settings.passwordCategories || ["工作","社交","银行","购物","娱乐","其他"]); }

function showPwdCatManager(){

}

function closeCatManager(mask){
  mask.classList.remove("show");
  setTimeout(()=>mask.remove(), 250);
}

function showPwdCatEdit(idx, oldName){
  const editMask = document.createElement("div");
  editMask.className = "edit-mask";
  editMask.innerHTML = `
    <div class="edit-dialog" role="dialog" style="max-width:340px">

        <button class="btn primary" id="catEditSave">保存</button>
      </div>
    </div>`;
  document.body.appendChild(editMask);
  requestAnimationFrame(()=> editMask.classList.add("show"));
  
  const input = editMask.querySelector("#catEditInput");
  input.focus();
  input.select();
  
  const close = ()=>{
    editMask.classList.remove("show");
    setTimeout(()=>editMask.remove(), 250);
  };
  editMask.querySelector("#catEditCancel").addEventListener("click", close);
  editMask.addEventListener("click", e=>{ if(e.target===editMask) close(); });
  editMask.querySelector("#catEditSave").addEventListener("click", ()=>{
    const trimmed = input.value.trim();
    if(!trimmed){ toast("请输入分类名称"); return; }
    if(trimmed === oldName){ close(); return; }
    const cats = getPwdCats();
    if(cats.includes(trimmed)){ toast("分类名称已存在"); return; }
    const updated = [...cats];
    updated[idx] = trimmed;
    state.settings.passwordCategories = updated;
    save();
    close();
    // 刷新分类管理弹窗
    const mgrMask = document.querySelector(".edit-mask.show");
    if(mgrMask) renderCatManager(mgrMask);
  });
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter") editMask.querySelector("#catEditSave").click();
    if(e.key === "Escape") close();
  });

function renderCatManager(mask){
  const cats = getPwdCats();
  let listHtml = cats.map((c, i) => `
    <div class="pwd-cat-row" draggable="true" data-cat-idx="${i}">
      <span class="drag-handle" title="拖拽排序">⠿</span>
      <span class="cat-name">${esc(c)}</span>
      <button class="btn-icon" data-cat-edit="${i}" title="编辑">${svg("edit")}</button>
      <button class="btn-icon del" data-cat-del="${i}" title="删除">×</button>
    </div>
  `).join("");
  mask.innerHTML = `
    <div class="edit-dialog" role="dialog" style="max-width:360px">
      <h3 style="justify-content:center">管理密码分类</h3>
      <div class="pwd-cat-add">
        <input type="text" id="catNewInput" placeholder="输入新分类名称">
        <button class="btn primary" id="catAddBtn">添加</button>
      </div>
      <div class="pwd-cat-list">${listHtml || '<div style="text-align:center;padding:20px;color:var(--ink-muted);font-size:13px">暂无分类</div>'}</div>
      <div class="actions">
        <button class="btn ghost" id="catCloseBtn">完成</button>
      </div>
    </div>`;
  
  const close = ()=> closeCatManager(mask);
  
  mask.querySelector("#catCloseBtn").addEventListener("click", close);
  
  // 添加新分类
  const input = mask.querySelector("#catNewInput");
  mask.querySelector("#catAddBtn").addEventListener("click", ()=>{
    const name = input.value.trim();
    if(!name){ toast("请输入分类名称"); return; }
    const cats = getPwdCats();
    if(cats.includes(name)){ toast("分类已存在"); return; }
    state.settings.passwordCategories = [...cats, name];
    save();
    renderCatManager(mask);
    input.value = "";
    setTimeout(()=> input.focus(), 50);
  });
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter") mask.querySelector("#catAddBtn").click();
  });
  
  // 编辑分类
  mask.querySelectorAll("[data-cat-edit]").forEach(btn => {
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.catEdit);
      const cats = getPwdCats();
      const old = cats[idx];
      showPwdCatEdit(idx, old);
    });
  });
  
  // 删除分类
  mask.querySelectorAll("[data-cat-del]").forEach(btn => {
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.dataset.catDel);
      const cats = getPwdCats();
      const name = cats[idx];
      if(!confirm(`确定删除分类「${name}」？\n已有密码记录的分类不会改变。`)) return;
      const updated = cats.filter((_, i) => i !== idx);
      state.settings.passwordCategories = updated;
      save();
      renderCatManager(mask);
    });
  });
  
  // 拖拽排序
  let dragSrcIdx = null;
  mask.querySelectorAll(".pwd-cat-row[draggable]").forEach(row => {
    row.addEventListener("dragstart", e=>{
      dragSrcIdx = Number(row.dataset.catIdx);
      row.style.opacity = "0.4";
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragend", ()=>{
      row.style.opacity = "1";
      mask.querySelectorAll(".pwd-cat-row").forEach(r => r.classList.remove("drag-over"));
    });
    row.addEventListener("dragover", e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", ()=>{
      row.classList.remove("drag-over");
    });
    row.addEventListener("drop", e=>{
      e.preventDefault();
      row.classList.remove("drag-over");
      const dropIdx = Number(row.dataset.catIdx);
      if(dragSrcIdx === null || dragSrcIdx === dropIdx) return;
      const cats = getPwdCats();
      const updated = [...cats];
      const [moved] = updated.splice(dragSrcIdx, 1);
      updated.splice(dropIdx, 0, moved);
      state.settings.passwordCategories = updated;
      save();
      renderCatManager(mask);
    });
  });
}

function pagePasswords(keyword){
  const list = state.passwords || [];
  const kw = (keyword || "").trim().toLowerCase();
  let filtered = list;
  if(kw){
    filtered = list.filter(p => (p.site || "").toLowerCase().includes(kw));
  }
  let html = `
    <div class="card" style="margin-bottom:14px">
      <h2>密码管理 <span class="sub">${list.length} 条</span></h2>
      <div style="margin-bottom:10px"><input type="text" id="pwdSearch" placeholder="搜索网站名称..." value="${esc(keyword||"")}" style="width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:13.5px;outline:none"></div>
      <div style="text-align:center;margin-bottom:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="pwdAddBtn">+ 新增密码</button><button class="btn" id="pwdCatBtn">管理分类</button></div>
    </div>`;
  if(!filtered.length){
    html += `<div class="card"><div class="empty"><div class="sym">🔐</div>${kw ? "未找到匹配的密码记录" : "还没有密码记录"}</div></div>`;
    return html;
  }
  const grouped = {};
  filtered.forEach(p => {
    const cat = p.category || "其他";
    if(!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(p);
  });
  const catOrder = getPwdCats().filter(c => grouped[c]);
  // 同时显示不在预设分类中的密码分组
  const extraCats = Object.keys(grouped).filter(c => !getPwdCats().includes(c)).sort();
  const allCats = [...catOrder, ...extraCats];
  allCats.forEach(c => {
    if(!grouped[c]) return;
    html += `<div class="card"><h2>${esc(c)} <span class="sub">${grouped[c].length} 条</span></h2>`;
    grouped[c].forEach(p => {
      html += `<div class="pwd-item" data-pwid="${p.id}">
        <div class="pwd-row">
          <span class="pwd-site">${esc(p.site)}</span>
          <span class="pwd-actions">
            <button class="btn-icon" data-pwd-view="${p.id}" title="查看详情">${svg("search")}</button>
            <button class="del" data-pwd-del="${p.id}" title="删除">×</button>
          </span>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

      navigator.clipboard.writeText(text).then(()=>toast(label+"已复制")).catch(()=>{});
    } else {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      toast(label+"已复制");
    }
  };
  document.getElementById("pwdCopyUrl")?.addEventListener("click", ()=>{
    copyText(f.url.value, "网址");
  });
  document.getElementById("pwdCopyUser")?.addEventListener("click", ()=>{
    copyText(f.username.value, "用户名");
  });
  document.getElementById("pwdCopyPw")?.addEventListener("click", ()=>{
    copyText(f.password.value, "密码");
  });
}

/* ============== 导入导出 ============== */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="身体管理数据_"+todayStr()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("已导出");
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!confirm("导入将覆盖当前所有数据，确认继续？")) return;
      state=deepMerge(structuredClone(DEFAULTS), parsed);
      if(!Array.isArray(state.periods)) state.periods=[];
      save(); toast("导入成功"); navigate(currentPage);
    }catch(err){ toast("导入失败："+err.message); }
  };
  reader.readAsText(file);
  e.target.value="";
}

/* ============== Gist 同步 ============== */
function getSyncData(){
  const d = {...state};
  delete d.settings; // 不上传 token 和偏好设置
  return d;
}
function fmtTime(t){
  if(!t) return "从未同步";
  const d=new Date(t);
  return d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")+"-"+d.getDate().toString().padStart(2,"0")+" "+d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
}
// 数据记录数（用于判断哪份数据更全）
function countRecords(d){
  let n = 0;
  ["periods","salary","housingAllowance","weight","measure","diet","exercise","stock"].forEach(k=>{
    if(Array.isArray(d[k])) n += d[k].length;
  });
  return n;
}
// 自动发现云端已有的工作台 Gist（取数据最全的一个）
async function findGist(){
  const token=state.settings.gistToken;
  if(!token) return null;
  glog("findGist: 开始查找云端 Gist...");
  try{
    const res = await fetch("https://api.github.com/gists?per_page=100", {
      headers:{"Authorization":"Bearer "+token}
    });
    if(!res.ok){ glog("findGist: 列表接口失败 HTTP "+res.status); return null; }
    const gists = await res.json();
    glog("findGist: 共 "+gists.length+" 个 Gist");
    let best=null, bestCount=-1;
    for(const g of gists){
      if(!g.files || !g.files["workbench-data.json"]) continue;
      // 列表接口不含 content，需用详细接口获取内容
      let d=null;
      try{
        const detail = await fetch("https://api.github.com/gists/"+g.id, {
          headers:{"Authorization":"Bearer "+token}
        });
        if(!detail.ok) continue;
        const full = await detail.json();
        const content = full.files && full.files["workbench-data.json"] && full.files["workbench-data.json"].content;
        if(!content) continue;
        d = JSON.parse(content);
      }catch(e){ continue; }
      const c = countRecords(d);
      glog("findGist: "+g.id.slice(0,8)+" 记录数="+c);
      if(c > bestCount){ best=g; bestCount=c; }
    }
    if(best) glog("findGist: 选定 "+best.id.slice(0,8)+"（"+bestCount+" 条）");
    else glog("findGist: 未找到任何数据 Gist");
    return best;
  }catch(e){ glog("findGist: 异常 "+e.message); return null; }
}
// 合并远程数据：远程数据更全或更新时覆盖本地（保留本地 settings）
function mergeRemote(remote){
  if(!remote || !remote.meta) return false;
  const lc = countRecords(state);
  const rc = countRecords(remote);
  const remoteNewer = remote.meta.lastModified > state.meta.lastModified;
  const useRemote = (rc > 0 && lc === 0) || (rc > 0 && lc > 0 && remoteNewer) || (rc === 0 && lc === 0 && remoteNewer);
  if(!useRemote) return false;
  const localSettings = state.settings;
  Object.assign(state, remote);
  state.settings = localSettings;
  state.meta.lastModified = remote.meta.lastModified;
  return true;
}
function updateSyncStatus(){
  const el=document.getElementById("gistStatus");
  if(!el) return;
  const s=state.settings;
  const dbg=document.getElementById("gistDebugBox");
  if(dbg){
    dbg.style.display = s.gistDebug ? "block" : "none";
    dbg.textContent = s.gistDebug || "";
  }
  if(!s.gistToken){ el.textContent="未配置 Token，请在输入框填写后保存。"; return; }
  if(!s.gistId){ el.textContent="Token 已保存，点击「立即同步」自动连接云端并同步数据。"; return; }
  const status = s.gistLastSyncStatus;
  const time = fmtTime(s.gistLastSync);
  if(status==="ok") el.textContent="✅ 上次同步成功："+time;
  else if(status && status.startsWith("error")) el.textContent="❌ 同步失败："+status.slice(6)+"（"+time+"）";
  else el.textContent="⏳ 状态未知";
}
function persistGistState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
// 同步调试日志（写入 localStorage，设置页可见）
function glog(msg){
  try{
    const t = new Date();
    const time = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+":"+String(t.getSeconds()).padStart(2,"0");
    state.settings.gistDebug = time+" "+msg+"\n"+(state.settings.gistDebug||"").slice(0,600);
    persistGistState();
  }catch(e){}
}
// 解析目标 Gist：优先云端数据最全的 Gist，否则沿用当前 ID
async function resolveGist(){
  const token=state.settings.gistToken;
  if(!token) return null;
  const found = await findGist();
  let foundCount = -1;
  if(found){
    // 列表接口不含 content，需重新拉取详细数据计算记录数
    const fd = await pullFromGist(found.id);
    if(fd) foundCount = countRecords(fd);
  }
  const curId = state.settings.gistId;
  if(!curId){
    if(found){ state.settings.gistId = found.id; persistGistState(); glog("resolveGist: 绑定 "+found.id.slice(0,8)); return found.id; }
    return null; // 需要新建
  }
  if(found && curId === found.id) return curId;
  // 比较当前 Gist 与云端最全 Gist 的数据量
  let curCount = 0;
  const cur = await pullFromGist(curId);
  if(cur) curCount = countRecords(cur);
  glog("resolveGist: 云端最全="+foundCount+"，当前="+curCount);
  if(foundCount > curCount){
    state.settings.gistId = found.id;
    persistGistState();
    glog("resolveGist: 切换到 "+found.id.slice(0,8));
    return found.id;
  }
  return curId;
}
async function syncToGist(){
  const token=state.settings.gistToken;
  if(!token) return;
  glog("syncToGist: 开始同步");
  try{
    // 1. 确定目标 Gist：自动发现云端最全的，没有则创建
    let gistId = await resolveGist();
    glog("syncToGist: 目标 gistId="+(gistId||"无"));
    if(!gistId){
      glog("syncToGist: 创建新 Gist...");
      const createRes = await fetch("https://api.github.com/gists", {
        method:"POST",
        headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
        body:JSON.stringify({description:"工作台数据同步", public:false, files:{"workbench-data.json":{content:"{}"}}})
      });
      if(!createRes.ok){ glog("syncToGist: 创建失败 HTTP "+createRes.status); throw new Error("HTTP "+createRes.status); }
      const g = await createRes.json();
      gistId = g.id;
      state.settings.gistId = gistId;
      glog("syncToGist: 已创建 "+gistId.slice(0,8));
    }
    // 2. 上传前先拉取云端数据，更全或更新则先合并
    glog("syncToGist: 拉取云端数据...");
    const remote = await pullFromGist(gistId);
    if(remote) glog("syncToGist: 云端记录数="+countRecords(remote));
    const merged = remote ? mergeRemote(remote) : false;
    glog("syncToGist: 合并结果="+merged+"，本地记录数="+countRecords(state));
    // 3. 上传（合并后的）数据
    const body = JSON.stringify(getSyncData(), null, 2);
    const res = await fetch("https://api.github.com/gists/"+gistId, {
      method:"PATCH",
      headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify({files:{"workbench-data.json":{content:body}}})
    });
    if(!res.ok){ const err=await res.text(); glog("syncToGist: 上传失败 HTTP "+res.status); throw new Error("HTTP "+res.status); }
    glog("syncToGist: 上传成功");
    state.settings.gistId = gistId;
    state.settings.gistLastSync=Date.now();
    state.settings.gistLastSyncStatus="ok";
    persistGistState();
    updateSyncStatus();
    toast(merged ? "已合并云端数据并同步" : "同步成功");
    // 若合并了远程数据，刷新当前页面显示
    if(merged && currentPage) navigate(currentPage);
  }catch(e){
    glog("syncToGist: 异常 "+e.message);
    state.settings.gistLastSync=Date.now();
    state.settings.gistLastSyncStatus="error:"+e.message;
    persistGistState();
    updateSyncStatus();
    toast("同步失败："+e.message);
  }
}
async function pullFromGist(gistId){
  const token=state.settings.gistToken;
  if(!token) return null;
  try{
    if(!gistId){
      const found = await findGist();
      if(!found) return null;
      gistId = found.id;
      state.settings.gistId = gistId;
      persistGistState();
    }
    const res = await fetch("https://api.github.com/gists/"+gistId, {
      headers:{"Authorization":"Bearer "+token}
    });
    if(!res.ok){ glog("pullFromGist: 获取失败 HTTP "+res.status); return null; }
    const gist = await res.json();
    const content = gist.files && gist.files["workbench-data.json"] && gist.files["workbench-data.json"].content;
    if(!content){ glog("pullFromGist: 文件内容为空"); return null; }
    return JSON.parse(content);
  }catch(e){ glog("pullFromGist: 异常 "+e.message); return null; }
}
async function initSync(){
  const s=state.settings;
  if(!s.gistToken) return;
  glog("initSync: 启动拉取");
  const gistId = await resolveGist();
  if(!gistId){ glog("initSync: 无目标 Gist"); return; }
  const remote = await pullFromGist(gistId);
  const merged = remote ? mergeRemote(remote) : false;
  glog("initSync: 合并="+merged+"，本地记录数="+countRecords(state));
  if(merged){
    save(); // 写回 localStorage
    toast("已从云端同步最新数据");
    if(currentPage) navigate(currentPage);
  }
  s.gistLastSync=Date.now();
  s.gistLastSyncStatus="ok";
  persistGistState();
  updateSyncStatus();
}
