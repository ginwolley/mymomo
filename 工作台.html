<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#E6F7FF" />
<title>momo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="momo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.jpg">
<!-- Supabase JavaScript SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span>momo</div>
    <nav class="nav-tree" id="nav"></nav>
    <div class="nav-foot">本地存储 · 离线可用<br>数据仅存于本机浏览器</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="hamburger" id="hamburger" aria-label="菜单">&#9776;</button>
        <button class="btn ghost" id="topBackBtn" style="display:none;padding:4px 10px;font-size:14px;min-width:0;border-radius:var(--radius-sm)">&#8592; 返回</button>
        <h1 id="pageTitle">概览</h1>
      </div>
      <div class="date" id="todayDate"></div>
    </div>
    <div class="content" id="page"></div>
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="tab-home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>首页</span>
      </button>
      <button class="tab" data-tab="tab-record">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>健康</span>
      </button>
      <button class="tab" data-tab="stock-overview">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 10h16M10 4v16" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>囤货</span>
      </button>
      <button class="tab" data-tab="tab-more">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        <span>更多</span>
      </button>
    </nav>
  </div>
</div>
<div class="nav-mask" id="navMask"></div>
<div id="toast"></div>


<script src="seed-data.js"></script>
<script>// 手机端或 seed-data.js 缺失时使用空数据兜底
if(typeof window.__SEED_DATA__==="undefined") window.__SEED_DATA__={periods:[],salary:[],housing:[]};</script>
<script src="js/core.js"></script>
<script src="js/sync.js"></script>
<script src="js/fitness.js"></script>
<script src="js/overview.js"></script>
<script src="js/salary.js"></script>
<script src="js/settings.js"></script>
<script src="js/stock.js"></script>
<script src="js/passwords.js"></script>
<script src="js/app.js"></script>
</body>
</html>
